spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/support_assistant
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    baseline-on-migrate: true
  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        max-document-batch-size: 12

